<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KBO 카드게임</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>⚾ KBO 카드게임</h1>
</header>


<!-- 시작 화면 -->
<section id="startScreen">

    <h2>구단 선택</h2>

    <select id="teamSelect">

        <option value="SSG">SSG 랜더스</option>
        <option value="KIA">KIA 타이거즈</option>
        <option value="KT">KT 위즈</option>
        <option value="삼성">삼성 라이온즈</option>
        <option value="두산">두산 베어스</option>
        <option value="롯데">롯데 자이언츠</option>
        <option value="LG">LG 트윈스</option>
        <option value="한화">한화 이글스</option>
        <option value="키움">키움 히어로즈</option>
        <option value="NC">NC 다이노스</option>

    </select>


    <button onclick="startGame()">
        게임 시작
    </button>

</section>



<!-- 메인 화면 -->

<section id="mainScreen" style="display:none;">


<div class="top">

    <div>
        💰 보유 자금:
        <span id="money">
            100억
        </span>
    </div>


    <div>
        📄 일반 계약서:
        <span id="normalContract">
            5
        </span>
    </div>


    <div>
        ⭐ 고급 계약서:
        <span id="premiumContract">
            1
        </span>
    </div>

</div>



<h2 id="myTeam">
    팀명
</h2>



<div class="menu">


<button onclick="openLeague()">
    ⚾ 리그
</button>


<button onclick="openGacha()">
    🎴 뽑기
</button>


<button onclick="openEnhance()">
    🔥 강화
</button>


<button onclick="openShop()">
    🛒 상점
</button>


<button onclick="openInventory()">
    📦 보관함
</button>


</div>



<div id="content">

게임을 시작하세요

</div>



</section>





<!-- JS 연결 -->


<script src="teams.js"></script>

<script src="data/players.js"></script>


<script src="card.js"></script>

<script src="gacha.js"></script>

<script src="enhance.js"></script>

<script src="system/tutorial.js"></script>
<script src="system/save.js"></script>
<script src="system/legend.js"></script>
<script src="system/shop.js"></script>
<script src="system/mission.js"></script>


<script src="game/ai.js"></script>
<script src="game/game.js"></script>
<script src="game/season.js"></script>


<script src="script.js"></script>


</body>
</html>
